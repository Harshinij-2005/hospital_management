<div class="report-print-format">

    <h2>Test Document Report</h2>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Amount</th>
            </tr>
        </thead>

        <tbody>
            <% data.forEach(function(row) { %>
                <tr>
                    <td><%= row.name %></td>
                    <td><%= row.description %></td>
                    <td><%= format_money(row.amount) %></td>
                </tr>
            <% }); %>
        </tbody>
    </table>

</div>
